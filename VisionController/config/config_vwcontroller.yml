general:
  visca_port: 1000
  enable_aravis: false

mqtt:
  # broker: '192.168.181.204'
  # broker: '192.168.180.13'
  # broker: '10.1.3.180'
  # broker: '10.1.3.50'
  broker: 10.1.3.180
  port: 1883


  # ---- MQTT topics ---- #
  # Following are topics. Some topics have an optional qos parameter. Default is 0.

  # Camera configuration
  cameras:
    names:
      - 'Camera1'
      - 'Camera2'
      - 'Camera3'
      - 'Camera4'
      - 'Camera5'
      - 'Camera6'
      - 'Camera7'
      - 'Camera8'
      - 'Camera9'
    subtopics:
      - 'IP'
      - 'Type'
      - 'Width'
      - 'Height'
      - 'Format'
      - 'Framerate'
      - 'Zoom'
      - 'Exposure'
      - 'ExposureAuto'
      - 'Gain'
      - 'GainAuto'
      - 'Name'

  vision_controllers:
    names:
      - 'VisionController0'
    subtopics:
      - 'IP'
      - 'Width'
      - 'Height'
      - 'TilerRows'
      - 'TilerColumns'
      - 'Fullscreen'
      - 'Shutdown': 1
      - 'StartPipeline': 1
    tiles:
      names:
        - 'Tile01'
        - 'Tile02'
        - 'Tile03'
        - 'Tile04'
      subtopics:
        - 'Source'
        - 'Enable'
        - 'Exposure'
        - 'ExposureAuto'
        - 'Gain'
        - 'Zoom'

pipeline:
  tiler_rows: 2
  tiler_columns: 2  
  width: 3840
  height: 2160
  sink_element: 'nv3dsink'
  streammux_config: '/home/seaonics/Dev/VideoWallOrin/VisionController/config/streammux_config.txt'
  max_num_sources: 4
  batched_push_timeout: 20000
  batch_size: 4
  sync_inputs: 0
  enable_pipeline: false

    source_bin_path: "/app/VisionController/libs/cameras/nvuri_source_bin.py"
    controller_module_path: "/app/VisionController/libs/cameras/vapix_control.py"
  Z3:
    # source_bin_path: "/app/VisionController/libs/cameras/nvuri_source_bin.py"
    source_bin_path: "/app/VisionController/libs/cameras/nvuri_source_bin.py"
    controller_module_path: "/app/VisionController/libs/cameras/vapix_control.py"
  # Axis:
  #   source_bin_path: "VisionController.libs.cameras.uri_source_bin"

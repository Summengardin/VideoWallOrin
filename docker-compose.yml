
# TO RUN: docker compose up
# FOR DEBUG (with shell): docker compose run --rm videowall sh


services:
  videowall:
    # image: videowallorin
    image: vwvisioncontroller
    runtime: nvidia
    command: sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:  # Correct placement for manual device mappings
    - "/dev/nvidia0:/dev/nvidia0"
    - "/dev/nvidiactl:/dev/nvidiactl"
    - "/dev/nvidia-modeset:/dev/nvidia-modeset"
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,graphics
      - XDG_RUNTIME_DIR=/tmp/runtime-docker
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/X11:/etc/X11
      - ~/.Xauthority:/root/.Xauthority
    network_mode: host
    working_dir: /app
    tty: true
    stdin_open: true
    privileged: false
    restart: always
